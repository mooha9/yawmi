name: نشر يومي إلى GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: التحقق من ملف الأخبار
        run: python3 -c "import json;d=json.load(open('src/news.json'));assert d['date'] and d['markets'] and d['ai']['items'];print('news.json ok', d['date'])"
      - name: البناء
        run: python3 build.py && touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
